name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run unit and integration verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Detect generated reports
        if: always() && !cancelled()
        id: reports
        shell: bash
        run: |
          if compgen -G 'target/surefire-reports/TEST-*.xml' > /dev/null || \
             compgen -G 'target/failsafe-reports/TEST-*.xml' > /dev/null; then
            echo "junit=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f target/site/jacoco/jacoco.xml ]]; then
            echo "jacoco=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JUnit results
        if: always() && !cancelled() && steps.reports.outputs.junit == 'true'
        uses: dorny/test-reporter@v3
        with:
          name: JUnit test results
          path: target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Archive JaCoCo HTML and XML reports
        if: always() && !cancelled() && steps.reports.outputs.jacoco == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 14
