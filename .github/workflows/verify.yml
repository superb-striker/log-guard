name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run unit and integration verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publish JUnit results
        if: always() && !cancelled()
        uses: dorny/test-reporter@v2
        with:
          name: JUnit test results
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Archive JaCoCo HTML and XML reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 14
