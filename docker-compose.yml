x-log-guard-common: &log-guard-common
  build: .
  environment: &log-guard-environment
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/log-guard
    SPRING_DATASOURCE_USERNAME: guard
    SPRING_DATASOURCE_PASSWORD: guard_secret
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_USERNAME: admin
    SPRING_RABBITMQ_PASSWORD: admin
    WEBHOOK_URL: ${WEBHOOK_URL:-}
    SPRING_PROFILES_ACTIVE: docker
    AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
    AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - logguard-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: log-guard-postgres
    environment:
      POSTGRES_DB: log-guard
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: guard_secret
    ports:
      - "5432:5432"      # Mapping host machine port 5432 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Stores DB files permanently
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d log-guard"]
    restart: unless-stopped    # If container crashes, auto restart unless manually stoppe
    networks:
      - logguard-net           # Join shared private network: can talk to RabbitMQ + app

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: log-guard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_LOAD_DEFINITIONS: /etc/rabbitmq/definitions.json
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./src/main/resources/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - logguard-net

  superset:
      build: ./superset
      container_name: log-guard-superset
      environment:
        SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ports:
        - "8088:8088"
      volumes:
        - superset_data:/app/superset_home
      networks:
        - logguard-net
      restart: unless-stopped

  log-guard-shard-0:
    <<: *log-guard-common
    container_name: log-guard-app-shard-0
    environment:
      <<: *log-guard-environment
      SHARD_ID: 0
    ports:
      - "8080:8080"

  log-guard-shard-1:
    <<: *log-guard-common
    container_name: log-guard-app-shard-1
    environment:
      <<: *log-guard-environment
      SHARD_ID: 1

  log-guard-shard-2:
    <<: *log-guard-common
    container_name: log-guard-app-shard-2
    environment:
      <<: *log-guard-environment
      SHARD_ID: 2

  log-guard-shard-3:
    <<: *log-guard-common
    container_name: log-guard-app-shard-3
    environment:
      <<: *log-guard-environment
      SHARD_ID: 3

volumes:
  postgres_data:
  rabbitmq_data:
  superset_data:

networks:
  logguard-net:
